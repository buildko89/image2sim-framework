# ==============================================================================
# 749GT型 内航コンテナ船 テンプレート（「みかげ」「すざく」クラス）
#
#   出典:
#     - 日本財団 MEGURI2040 コンテナ船「みかげ」自律運航実証実験 公開諸元
#     - 日本財団 無人運航船プロジェクト「DFFAS」コンテナ船「すざく」公開諸元
#     - 内航標準749GT型コンテナ船 公開一般配置・主要目
# ==============================================================================
template_id: container_749gt
template_file: vessel_base.yaml
schema_version: '1.0'
vehicle_type: vessel
ship_class: coastal_container_749gt
name: "Mikage / Suzaku Class 749GT Coastal Container Ship"

provenance:
  principal_dimensions: "public (Nippon Foundation MEGURI2040 WG reports)"
  hydro_coefficients: "estimated (Kijima 1990 standard formula for coastal container)"
  radar_rcs: "estimated (IHO / ITU marine radar RCS benchmark for 100m cargo)"

# --- 主要目 -------------------------------------------------------------------
dimensions:
  length_oa_m: 96.81          # 全長
  length_pp_m: 90.00          # 垂線間長
  beam_m: 14.00               # 全幅
  depth_m: 7.50               # 型深さ
  draft_m: 3.80               # 計画喫水
  block_coefficient: 0.672    # Cb
  displacement_tonnes: 3280.0 # 満載排水量 Δ
  gross_tonnage_gt: 749.0     # 総トン数
  service_speed_kt: 14.5      # 航海速力 (約 7.46 m/s)
  max_speed_kt: 16.0          # 最大速力
  container_capacity_teu: 245 # 積載コンテナ数

# --- 船体形状 -----------------------------------------------------------------
hull:
  transom_width_ratio: 0.75
  transom_depth_ratio: 0.82
  flare_angle_deg: 28.0
  sheer_fore_m: 2.2
  sheer_aft_m: 0.8
  bulbous_bow:
    enabled: true
    protrusion_m: 2.4
    radius_m: 1.35
    center_z_m: -1.9
  cargo_hold:
    type: container_bays
    bays: 4
    stacks: 5
    tiers: 3
    container_color: assorted   # assorted | blue | green | red

# --- 外観（一般的な内航コンテナ船の配色。実船の塗装の再現ではない）-------------
paint:
  hull_topside: [0.09, 0.17, 0.33]
  deck: [0.30, 0.38, 0.32]
  funnel_band: [0.08, 0.30, 0.60]

# --- 上部構造物・船橋（船尾配置） ----------------------------------------------
superstructure:
  enabled: true
  type: aft_bridge
  length_m: 15.0
  width_m: 12.5
  height_m: 12.0
  decks: 4
  bridge_wing_width_m: 14.2
  bridge_view_height_m: 15.5
  funnel:
    height_m: 4.5
    diameter_m: 1.8
    pos_m: [0.0, -39.0, 14.0]
  mast:
    height_m: 9.0
    radar_platforms: 2

# --- アクチュエータ -----------------------------------------------------------
actuators:
  propellers:
    - id: main_prop
      type: FPP
      diameter_m: 3.20
      pitch_ratio: 0.86
      blades: 4
      shaft_pos_m: [0.0, -42.5, -2.2]
      max_rpm: 240.0
      rated_power_kw: 2200.0
  rudders:
    - id: main_rudder
      type: flap_or_spade
      area_m2: 7.20
      aspect_ratio: 1.65
      pos_m: [0.0, -44.8, -1.9]
      max_angle_deg: 35.0
      turn_rate_deg_s: 4.5
  thrusters:
    - id: bow_thruster
      type: tunnel_thruster
      pos_m: [0.0, 39.0, -2.0]
      diameter_m: 1.25
      thrust_kn: 55.0
      rated_power_kw: 380.0

# --- レーダ・通信・識別 -------------------------------------------------------
signatures:
  radar_cross_section_m2: 2500.0
  has_ais: true
  ais_class: A
  mmsi: 431001749
  callsign: "7K749"
  ship_type_code: 70          # Cargo

# --- センサ配置 ---------------------------------------------------------------
mounts:
  - id: radar_xband
    type: marine_radar
    pos_m: [0.0, -36.0, 20.5]
    rpm: 24.0
    band: X_BAND
  - id: radar_sband
    type: marine_radar
    pos_m: [0.0, -36.0, 18.0]
    rpm: 24.0
    band: S_BAND
  - id: lidar_bow
    type: lidar_3d
    pos_m: [0.0, 44.5, 6.8]
  - id: lidar_port_wing
    type: lidar_2d
    pos_m: [-7.1, -34.0, 15.2]
  - id: lidar_stbd_wing
    type: lidar_2d
    pos_m: [7.1, -34.0, 15.2]
  - id: camera_bow_center
    type: camera_rgb
    pos_m: [0.0, 44.0, 8.7]   # ブルワークの上端 7.23 m ＋ 1.5 m（K10。7.2 m では海がブルワークに隠れた）
    post_m: 3.2               # 甲板（5.46 m）までの支柱
    fov_deg: 90.0
  - id: camera_bridge_front
    type: camera_rgb
    pos_m: [0.0, -26.55, 15.5]  # 操舵室の前面（-26.7 m）の 0.15 m 前（K10。-33.5 m は操舵室の箱の中だった）
    fov_deg: 110.0
  - id: gnss_antenna
    type: gnss_antenna
    pos_m: [0.0, -36.0, 21.0]
  - id: gyro_compass
    type: gyro_compass
    pos_m: [0.0, -35.0, 4.0]
  - id: echo_sounder
    type: echo_sounder
    pos_m: [0.0, 32.0, -3.8]

# --- 出力設定 -----------------------------------------------------------------
output:
  directory: output/container_749gt
  blend: container_749gt.blend
  glb: container_749gt.glb
  mjcf: container_749gt.xml
  hydro_json: hydro_mmg.json
  profile_json: ship_sync.profile.json
  report_markdown: BUILD_REPORT.md

# 横揺れの復原（積付け状態の GM）。MJCF の重心の高さはここから決める（blend2mjcf_ship.py の center_of_gravity_z）
stability:
  gm_m: 1.2
