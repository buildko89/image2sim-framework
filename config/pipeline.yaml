project_name: image2sim-framework
reference_case: cat_avatar
input_dir: input/raw_photos
selected_dir: input/selected_photos
output_dir: output
reports_dir: output/reports
generation:
  mode: local_first
  paid_api_required: false
  cloud_api_enabled: false
  optional_cloud_providers:
    - tripo
    - meshy
  local_candidates:
    - triposr
    - instantmesh
    - hunyuan3d
  local_first: true
engines:
  targets:
    - godot
    - unity
    - unreal
  first_import_target: godot
environment:
  runtime: windows-venv  # windows-venv | wsl2-venv | docker
  blender_mode: windows-exe  # windows-exe | linux-blender | docker
  path_policy: windows-path-only
providers:
  preferred_3d_provider: local_first
  candidates:
    - triposr
    - instantmesh
    - hunyuan3d
    - tripo
    - meshy
  optional_only:
    - tripo
    - meshy
api:
  required_for_mvp: false
  polling_interval_sec: 10
  timeout_sec: 600
  max_retries: 3
  save_raw_response: true
  tripo:
    api_base_url: https://api.tripo3d.ai/v2/openapi
    input_dir: input/masks
    raw_3d_dir: output/raw_3d
    reports_dir: output/reports
    model_version: v2.5-20250123
    supported_extensions:
      - .png
      - .jpg
      - .jpeg
      - .webp
    texture: true
    pbr: true
    download_outputs: false
image_inventory:
  supported_extensions:
    - .jpg
    - .jpeg
    - .png
    - .webp
  low_resolution_threshold: 1024
  small_file_size_threshold_bytes: 100000
  min_aspect_ratio: 0.5
  max_aspect_ratio: 2.0
image_selection:
  inventory_file: output/reports/image_inventory.json
  selected_dir: input/selected_photos
  reports_dir: output/reports
  default_quality_score: 3
  valid_view_hints:
    - front
    - front_left
    - front_right
    - side_left
    - side_right
    - back
    - back_left
    - back_right
    - top
    - diagonal
    - unknown
  non_interactive:
    reject_warnings:
      - extreme_aspect_ratio
      - small_file_size
    allow_warnings:
      - missing_exif
      - has_alpha_channel
      - low_resolution
background_removal:
  selected_dir: input/selected_photos
  masks_dir: input/masks
  review_dir: input/masks_review
  reports_dir: output/reports
  model_cache_dir: output/model_cache/u2net
  supported_extensions:
    - .jpg
    - .jpeg
    - .png
    - .webp
  model_name: u2net
  min_foreground_coverage: 0.05
  max_foreground_coverage: 0.95
blender_reference_scene:
  selected_dir: input/selected_photos
  masks_dir: input/masks
  reports_dir: output/reports
  output_blend: output/raw_3d/cat_reference_scene.blend
  output_glb: output/raw_3d/cat_reference_scene.glb
  supported_extensions:
    - .jpg
    - .jpeg
    - .png
    - .webp
blender_cleanup_export:
  input_asset: output/raw_3d/cat_reference_scene.blend
  reports_dir: output/reports
  output_glb: output/clean_3d/cat_clean.glb
  output_fbx: output/clean_3d/cat_clean.fbx
  target_height: 1.0
godot_import_check:
  input_glb: output/clean_3d/cat_clean.glb
  output_dir: output/godot
  reports_dir: output/reports
blender:
  required: true
  role: import_cleanup_export
  manual_modeling_required: false
  allow_manual_editing: true
  use_paid_ai_plugin: false
  path_env: BLENDER_PATH
  target_engines:
    - godot
    - unity
    - unreal
  first_import_check: godot
  forward_axis: -Z
  up_axis: Y
metadata:
  schema_version: 0.1
