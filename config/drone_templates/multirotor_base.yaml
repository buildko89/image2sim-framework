schema_version: "1.1"
template_id: multirotor_base
units: mm
dimensions_provisional: true

coordinate_system:
  right_axis: +X
  front_axis: -Y
  up_axis: +Z
  root_origin: estimated_center_of_mass

layout:
  mode: radial
  rotor_count: 4
  radius_mm: 50.0
  start_angle_deg: -45.0
  id_prefix: r
  motor_axis_z_mm: 5.0

body:
  shape: rounded_box
  width_mm: 40.0
  length_mm: 55.0
  height_mm: 18.0
  center_z_mm: 0.0
  bevel_mm: 5.0

arm:
  enabled: true
  root_width_mm: 9.0
  tip_width_mm: 6.0
  thickness_mm: 4.0
  root_fraction: 0.28
  center_z_mm: 0.0

motor:
  housing_diameter_mm: 10.0
  housing_height_mm: 9.0
  center_z_mm: 2.0
  shaft_diameter_mm: 2.0
  shaft_height_mm: 3.0

propeller:
  diameter_mm: 36.0
  hub_diameter_mm: 6.0
  hub_height_mm: 2.5
  blade_count: 2
  blade_root_width_mm: 5.0
  blade_tip_width_mm: 3.0
  blade_thickness_mm: 1.0
  blade_root_radius_mm: 3.5
  center_z_mm: 9.0
  direction_pattern: [ccw, cw]
  direction_source: placeholder

guard:
  enabled: false
  size_mode: explicit
  outer_diameter_mm: 44.0
  tube_diameter_mm: 2.0
  center_z_mm: 6.0
  inner_gap_deg: 80.0
  major_segments: 40
  minor_segments: 8
  strut_count: 3
  strut_radius_mm: 0.65

landing:
  enabled: false
  leg_diameter_mm: 3.0
  leg_height_mm: 8.0
  leg_center_z_mm: -6.0
  foot_diameter_mm: 4.5
  foot_height_mm: 3.0
  foot_center_z_mm: -10.0

physics:
  center_of_mass_mm: [0.0, 0.0, 0.0]
  center_of_mass_source: placeholder
  mass_g: null
  inertia_kg_m2: null
  inertia_source: pending

references: {}

output:
  blend: model.blend
  glb: model.glb
  resolved_config: resolved_config.json
  build_report: build_report.json
  qa_report: qa_report.json
  render_resolution: 480
