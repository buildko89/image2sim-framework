# ==============================================================================
# Vertical Technologies DeltaQuad QuadPlane VTOL
# PX4 Standard VTOL Reference Model
# ==============================================================================
template_file: config/drone_templates/multirotor_base.yaml
schema_version: "1.1"
subject_id: deltaquad
units: mm
dimensions_provisional: false

coordinate_system:
  right_axis: +X
  front_axis: +Y
  up_axis: +Z
  root_origin: estimated_center_of_mass

measurements:
  overall_width_mm:
    value: 2350.0
    source: published_spec
    tolerance_mm: 20.0
    note: 実機翼幅 2.35m（ウィングレット外端間）
  overall_length_mm:
    value: 1100.0
    source: published_spec
    tolerance_mm: 20.0
    note: カーボンブーム全長および機体前後長
  overall_height_mm:
    value: 240.0
    source: estimated
    tolerance_mm: 30.0
    note: ウィングレット先端からブーム下面までの全高
  propeller_diameter_mm:
    value: 330.2
    source: assumed
    tolerance_mm: 5.0
    note: リフト用 13 インチカーボンプロペラ
  mass_g:
    value: 4800.0
    source: published_spec
    tolerance_g: 200.0
    note: 空虚重量 4.8 kg（MTOW 8.5 kg）

layout:
  mode: explicit
  motor_axis_z_mm: 50.0
  motor_positions_mm:
    lift_fl: [-480.0,  380.0, 50.0]
    lift_fr: [ 480.0,  380.0, 50.0]
    lift_rl: [-480.0, -580.0, 50.0]
    lift_rr: [ 480.0, -580.0, 50.0]
    pusher:  [   0.0, -470.0, 31.3]
  rotor_orientation_deg:
    pusher: [-90.0, 0.0, 0.0]
  rotor_roles:
    lift_fl: lift
    lift_fr: lift
    lift_rl: lift
    lift_rr: lift
    pusher: pusher

body:
  shape: lofted
  width_mm: 220.0
  length_mm: 780.0
  height_mm: 125.0
  center_y_mm: -100.0
  center_z_mm: 35.0
  nose_bias: 0.45
  longitudinal_segments: 24
  radial_segments: 32
  width_profile_power: 0.65
  height_profile_power: 0.70
  cross_section_power: 1.8
  material: dark

arm:
  enabled: false

structure:
  enabled: true
  show_grooves: false
  members:
    - id: boom_left
      shape: cylinder
      profile: boom
      material: carbon
      dimensions_mm: [28.0, 1100.0, 28.0]
      location_mm: [-480.0, -100.0, 15.0]
    - id: boom_right
      shape: cylinder
      profile: boom
      material: carbon
      dimensions_mm: [28.0, 1100.0, 28.0]
      location_mm: [480.0, -100.0, 15.0]

motor_mount:
  enabled: true
  material: dark
  dimensions_mm: [36.0, 90.0, 25.0]
  center_z_mm: 25.0
  bevel_mm: 3.0
  enabled_by_rotor:
    pusher: false

motor:
  housing_diameter_mm: 42.0
  housing_height_mm: 32.0
  center_z_mm: 35.0
  center_z_by_rotor_mm:
    pusher: 66.0
  shaft_diameter_mm: 6.0
  shaft_height_mm: 15.0
  material_by_rotor:
    pusher: aluminum

propeller:
  diameter_mm: 330.2
  hub_diameter_mm: 25.0
  hub_height_mm: 10.0
  blade_count: 2
  blade_root_width_mm: 26.0
  blade_tip_width_mm: 14.0
  blade_thickness_mm: 3.5
  blade_root_radius_mm: 14.0
  center_z_mm: 50.0
  directions:
    lift_fl: ccw
    lift_fr: cw
    lift_rl: cw
    lift_rr: ccw
    pusher: ccw
  direction_source: design
  diameter_overrides:
    pusher: 254.0
  blade_shape_by_rotor:
    pusher: scimitar
  spinner_by_rotor:
    pusher: bullet
  spinner_length_mm: 24.0
  spinner_material: aluminum

guard:
  enabled: false

landing:
  enabled: false

wing:
  enabled: true
  material: dark
  span_mm: 2350.0
  root_chord_mm: 520.0
  tip_chord_mm: 180.0
  sweep_deg: 26.5
  thickness_mm: 45.0
  center_x_mm: 0.0
  center_y_mm: -120.0
  center_z_mm: 30.0

tail:
  enabled: true
  material: dark
  surfaces:
    - id: winglet_left
      part_type: curved_winglet
      span_mm: 200.0
      root_chord_mm: 180.0
      tip_chord_mm: 65.0
      sweep_deg: 2.0
      trailing_curve_power: 2.2
      thickness_mm: 14.0
      tip_thickness_mm: 7.0
      center_x_mm: -1175.0
      center_y_mm: -445.8
      center_z_mm: 30.0
    - id: winglet_right
      part_type: curved_winglet
      span_mm: 200.0
      root_chord_mm: 180.0
      tip_chord_mm: 65.0
      sweep_deg: 2.0
      trailing_curve_power: 2.2
      thickness_mm: 14.0
      tip_thickness_mm: 7.0
      center_x_mm: 1175.0
      center_y_mm: -445.8
      center_z_mm: 30.0

control_surfaces:
  surfaces:
    - id: elevon_left
      axis: pitch
      material: dark
      max_deflection_deg: 25.0
      span_mm: 550.0
      root_chord_mm: 75.0
      tip_chord_mm: 55.0
      thickness_mm: 18.0
      center_x_mm: -820.0
      center_y_mm: -450.0
      center_z_mm: 30.0
    - id: elevon_right
      axis: roll
      material: dark
      max_deflection_deg: 25.0
      span_mm: 550.0
      root_chord_mm: 75.0
      tip_chord_mm: 55.0
      thickness_mm: 18.0
      center_x_mm: 820.0
      center_y_mm: -450.0
      center_z_mm: 30.0

equipment:
  boxes:
    - id: flight_computer
      part_type: flight_computer
      dimensions_mm: [70.0, 90.0, 30.0]
      location_mm: [0.0, 0.0, 45.0]
      material: electronics
    - id: gps
      part_type: gps
      dimensions_mm: [50.0, 50.0, 15.0]
      location_mm: [0.0, 120.0, 65.0]
      material: electronics
    - id: battery
      part_type: battery
      dimensions_mm: [100.0, 200.0, 50.0]
      location_mm: [0.0, -40.0, 25.0]
      material: electronics

physics:
  center_of_mass_mm: [0.0, -30.0, 30.0]
  center_of_mass_source: placeholder
  mass_g: 4800.0
  inertia_kg_m2: null
  inertia_source: pending

references:
  hero: input/raw_photos/deltaquad/hero.png

output:
  directory: output/deltaquad
  blend: deltaquad.blend
  glb: deltaquad.glb
  resolved_config: resolved_config.json
  build_report: build_report.json
  qa_report: qa_report.json
  render_resolution: 720
