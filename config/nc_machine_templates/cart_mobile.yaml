  robot_mount: "estimated (photos)"
  pallet_anchors: "estimated (photos; the expansion stocker is approximated by a pallet)"

cart:
  width_m: 0.810
  depth_m: 1.345
  height_m: 0.800
  mass_kg: 300                  # 【推定】カタログに記載なし
  robot_mount_m: [0.0, 0.40, 0.800]

pallet_anchors:
  front: null
  door_side: null
  left: {pos_m: [-0.85, -0.20, 0.0], yaw_deg: 90}
