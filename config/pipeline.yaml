project_name: image2sim-framework
reference_case: cat_avatar
input_dir: input/raw_photos
selected_dir: input/selected_photos
output_dir: output
reports_dir: output/reports
generation:
  mode: local_first
  paid_api_required: false
  cloud_api_enabled: false
  optional_cloud_providers:
    - tripo
    - meshy
  local_candidates:
    - triposr
    - instantmesh
    - hunyuan3d
  local_first: true
route_a_evaluation:
  schema_version: "1.0"
  tools:
    blender_path: C:/Program Files/Blender Foundation/Blender 5.2/blender.exe
    godot_path: D:/Godot_v4.6-stable_mono_win64/Godot_v4.6-stable_mono_win64_console.exe
  blender_evaluation:
    target_size: 1.0
    render_resolution: 1440
    front_axis: -Y
  input_manifest:
    subject_id: koha
    background_report: output/reports/background_removal.json
    output: output/reports/route_a_evaluation/input_manifest.json
    views:
      cat_side:
        view: side_left
        role: primary_generation
        source_file: input/selected_photos/reference_side_standing_pattern_1713434749448.jpg
        eligible_for_generation: true
      cat_front:
        view: front
        role: holdout
        source_file: input/selected_photos/reference_front_face_1763363798733.jpg
        eligible_for_generation: false
      cat_back:
        view: back
        role: holdout
        source_file: input/selected_photos/reference_back_top_tail_1755598074234.jpg
        eligible_for_generation: false
      cat_top:
        view: top_back
        role: holdout
        source_file: input/selected_photos/reference_back_top_motion_1762988855408_frame_000630.jpg
        eligible_for_generation: false
      cat_other_side:
        view: side_right
        role: holdout
        source_file: input/selected_photos/reference_side_right_body_1698975320501.jpg
        eligible_for_generation: false
  drone_input_manifest:
    subject_id: drone_proto
    background_report: output/reports/drone_background/background_removal.json
    output: output/reports/route_a_evaluation/drone_input_manifest.json
    views:
      drone_oblique_top:
        view: oblique_top
        role: primary_generation
        source_file: input/raw_photos/drone/drone4.png
        eligible_for_generation: true
      drone_top:
        view: top_front
        role: secondary_generation
        source_file: input/raw_photos/drone/drone1.png
        eligible_for_generation: true
      drone_oblique_side:
        view: oblique_side
        role: holdout
        source_file: input/raw_photos/drone/drone2.png
        eligible_for_generation: false
      drone_front:
        view: front
        role: holdout
        source_file: input/raw_photos/drone/drone3.png
        eligible_for_generation: false
      drone_back_side:
        view: back_side
        role: holdout
        source_file: input/raw_photos/drone/drone5.png
        eligible_for_generation: false
  release_candidates:
    - triposr
  comparison_only:
    - partcrafter
    - instantmesh
    - hunyuan3d
    - spar3d
  deferred_gpu_candidates:
    - pixal3d
    - trellis2
  classification_policy:
    unknown_license: comparison_only
    restricted_lineage_in_release: reject
    missing_lineage_in_release: reject
engines:
  targets:
    - godot
    - unity
    - unreal
  first_import_target: godot
environment:
  runtime: windows-venv  # windows-venv | wsl2-venv | docker
  blender_mode: windows-exe  # windows-exe | linux-blender | docker
  path_policy: windows-path-only
providers:
  preferred_3d_provider: local_first
  candidates:
    - triposr
    - instantmesh
    - hunyuan3d
    - tripo
    - meshy
  optional_only:
    - tripo
    - meshy
api:
  required_for_mvp: false
  polling_interval_sec: 10
  timeout_sec: 600
  max_retries: 3
  save_raw_response: true
  tripo:
    api_base_url: https://api.tripo3d.ai/v2/openapi
    input_dir: input/masks
    raw_3d_dir: output/raw_3d
    reports_dir: output/reports
    model_version: v2.5-20250123
    supported_extensions:
      - .png
      - .jpg
      - .jpeg
      - .webp
    texture: true
    pbr: true
    download_outputs: false
image_inventory:
  supported_extensions:
    - .jpg
    - .jpeg
    - .png
    - .webp
  low_resolution_threshold: 1024
  small_file_size_threshold_bytes: 100000
  min_aspect_ratio: 0.5
  max_aspect_ratio: 2.0
image_selection:
  inventory_file: output/reports/image_inventory.json
  selected_dir: input/selected_photos
  reports_dir: output/reports
  default_quality_score: 3
  valid_view_hints:
    - front
    - front_left
    - front_right
    - side_left
    - side_right
    - back
    - back_left
    - back_right
    - top
    - diagonal
    - unknown
  non_interactive:
    reject_warnings:
      - extreme_aspect_ratio
      - small_file_size
    allow_warnings:
      - missing_exif
      - has_alpha_channel
      - low_resolution
background_removal:
  selected_dir: input/selected_photos
  masks_dir: input/masks
  review_dir: input/masks_review
  reports_dir: output/reports
  model_cache_dir: output/model_cache/u2net
  supported_extensions:
    - .jpg
    - .jpeg
    - .png
    - .webp
  model_name: u2net
  min_foreground_coverage: 0.05
  max_foreground_coverage: 0.95
blender_reference_scene:
  selected_dir: input/selected_photos
  masks_dir: input/masks
  reports_dir: output/reports
  output_blend: output/raw_3d/cat_reference_scene.blend
  output_glb: output/raw_3d/cat_reference_scene.glb
  supported_extensions:
    - .jpg
    - .jpeg
    - .png
    - .webp
blender_cleanup_export:
  input_asset: output/raw_3d/cat_reference_scene.blend
  reports_dir: output/reports
  output_glb: output/clean_3d/cat_clean.glb
  output_fbx: output/clean_3d/cat_clean.fbx
  target_height: 1.0
godot_import_check:
  input_glb: output/clean_3d/cat_clean.glb
  output_dir: output/godot
  reports_dir: output/reports
blender:
  required: true
  role: import_cleanup_export
  manual_modeling_required: false
  allow_manual_editing: true
  use_paid_ai_plugin: false
  path_env: BLENDER_PATH
  target_engines:
    - godot
    - unity
    - unreal
  first_import_check: godot
  forward_axis: -Z
  up_axis: Y
metadata:
  schema_version: 0.1
