notes:
- koha のオレンジは明るい橙ではなく深いラスト（錆色）。肩の斑の中心が最も濃い。
- 黒斑は背面写真では影で (4,4,2) まで潰れる。黒の代表値は正面写真の black_mask を使う。
- 顔のオレンジ（頬・額）は影で沈むため面積色として使えない。
