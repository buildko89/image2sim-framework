project_name: image2sim-framework
reference_case: cat_avatar
input_dir: input/raw_photos
selected_dir: input/selected_photos
output_dir: output
reports_dir: output/reports
environment:
  runtime: windows-venv  # windows-venv | wsl2-venv | docker
  blender_mode: windows-exe  # windows-exe | linux-blender | docker
  path_policy: windows-path-only
providers:
  preferred_3d_provider: tripo
  candidates:
    - tripo
    - meshy
    - local
api:
  polling_interval_sec: 10
  timeout_sec: 600
  max_retries: 3
  save_raw_response: true
  tripo:
    api_base_url: https://api.tripo3d.ai/v2/openapi
    input_dir: input/masks
    raw_3d_dir: output/raw_3d
    reports_dir: output/reports
    model_version: v2.5-20250123
    supported_extensions:
      - .png
      - .jpg
      - .jpeg
      - .webp
    texture: true
    pbr: true
    download_outputs: false
image_inventory:
  supported_extensions:
    - .jpg
    - .jpeg
    - .png
    - .webp
  low_resolution_threshold: 1024
  small_file_size_threshold_bytes: 100000
  min_aspect_ratio: 0.5
  max_aspect_ratio: 2.0
image_selection:
  inventory_file: output/reports/image_inventory.json
  selected_dir: input/selected_photos
  reports_dir: output/reports
  default_quality_score: 3
  valid_view_hints:
    - front
    - front_left
    - front_right
    - side_left
    - side_right
    - back
    - back_left
    - back_right
    - top
    - diagonal
    - unknown
  non_interactive:
    reject_warnings:
      - extreme_aspect_ratio
      - small_file_size
    allow_warnings:
      - missing_exif
      - has_alpha_channel
      - low_resolution
background_removal:
  selected_dir: input/selected_photos
  masks_dir: input/masks
  review_dir: input/masks_review
  reports_dir: output/reports
  model_cache_dir: output/model_cache/u2net
  supported_extensions:
    - .jpg
    - .jpeg
    - .png
    - .webp
  model_name: u2net
  min_foreground_coverage: 0.05
  max_foreground_coverage: 0.95
blender:
  path_env: BLENDER_PATH
  target_engine: unity
  forward_axis: -Z
  up_axis: Y
metadata:
  schema_version: 0.1
