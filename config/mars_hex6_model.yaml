# ==============================================================================
# mars_hex6 —— 火星専用機（6 発ヘキサ・NASA Mars Science Helicopter 案の系統）
# ★★★★ 2026-09-13 ユーザ確定: origin-01 は使わない・形の正本はこの YAML。
#   ★★★★ **見た目は drone2（config/drone2_model.yaml）の設定をコピーして火星機の大きさにしたもの**
#     （ユーザ提案「ヘキサコプターなら drone2 を使えばよいのでは」）。
#     卵形の殻（lofted）・テーパのアーム・モータ下の脚と赤い足 ＝ drone2 と同じ意匠。
#     ★ drone2 は機首が −Y だが、この機体は **+Y を機首**にしてある —— hakoniwa の blend2mjcf.py と
#       Godot（glTF の −Z）はどちらも +Y を前として扱うので、−Y にするとカメラが後ろ向きに飛ぶ。
#   物理モデルは hakoniwa-mujoco-drone の tools/blend2mjcf.py がこの .blend から作る。
# ★ drone2 から変えたところ（理由つき）:
#   * ロータ 4 → 6（Ingenuity の同軸 2 枚はサイクリックが無く作れない → MSH と同じ 6 発）
#     1.10 m × 6 を半径 1.25 m に等間隔（隣の円板の隙間 150 mm）
#   * ガードは付けない（1.1 m の輪が 6 個 ＝ 火星では C_T の関門に質量が効く）
#   * 脚は landing（per_rotor）ではなく structure.members の円柱（per_rotor は当たり判定が作られず胴体で着地する）
#   * 胴体の上にマストで太陽電池パネル（プロペラの内側に収まる）・下向きの航法カメラと高度計（VO 前提・M-5）
#   * 脚を長くして支持の幅を 2.5 m（低重力は転倒の復元が小さい）
# ==============================================================================
