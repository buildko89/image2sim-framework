  propeller_diameter_mm:
    value: 863.6
    source: part_number_and_drawing
    tolerance_mm: 1.0
    note: T-MOTOR G34×11.5、34 inch
  frame_center_width_mm:
    value: 880.0
    source: dimensions_png_and_parts_list
    tolerance_mm: 1.0
  cross_frame_inset_mm:
    value: 500.0
    source: photo_reinspection
    tolerance_mm: 5.0
    note: 2445 mm材端のモーター中心から2560 mm材交点まで中央寄り
  gps_mast_height_mm:
    value: 500.0
    source: user_confirmed_and_photo
    tolerance_mm: 1.0
    note: 円形アンテナ下端までの支柱長
  landing_leg_height_mm:
    value: 500.0
    source: dimensions_png_and_parts_list
    tolerance_mm: 1.0
  skid_length_mm:
    value: 1500.0
    source: dimensions_png_and_parts_list
    tolerance_mm: 1.0
  wing_span_mm:
    value: 2500.0
    source: drawing
    tolerance_mm: 5.0
  wing_chord_mm:
    value: 400.0
    source: drawing
    tolerance_mm: 5.0
  known_minimum_mass_g:
    value: 40349.3
    source: parts_list_plus_drawing_quantity_inference
