template_file: config/drone_templates/quad_x_guarded.yaml
schema_version: "1.1"
subject_id: drone2_petron_s
units: mm
dimensions_provisional: true

coordinate_system:
  right_axis: +X
  front_axis: -Y
  up_axis: +Z
  root_origin: estimated_center_of_mass

measurements:
  overall_length_mm:
    value: 133.0
    source: measured
    tolerance_mm: 1.0
    note: プロペラガードを含む全長
  overall_width_mm:
    value: 133.0
    source: measured
    tolerance_mm: 1.0
    note: プロペラガードを含む全幅
  motor_center_diagonal_mm:
    value: 95.0
    source: measured
    tolerance_mm: 1.0
    note: 対角にあるモーター軸の中心間距離
  propeller_diameter_mm:
    value: 50.0
    source: measured
    tolerance_mm: 1.0
    note: プロペラ先端から反対側先端までの全長として解釈
  body_height_mm:
    value: 25.0
    source: measured
    tolerance_mm: 1.0
    note: 寸法2.pngで前・横・後から測定した中央ボディ外殻の高さ
  body_length_mm:
    value: 50.0
    source: measured
    tolerance_mm: 1.0
    note: 寸法3.pngで上面から測定した中央ボディ外殻の前後全長
  overall_height_mm:
    value: 32.0
    source: placeholder
    tolerance_mm: 5.0
    note: 前・左写真からの初期仮置き。実測後に更新する
  mass_g:
    value: null
    source: placeholder
    tolerance_g: null
    note: 未測定

layout:
  mode: square_diagonal
  square_motor_layout: true
  motor_center_x_mm:
    value: 67.175144
    source: derived
    formula: motor_center_diagonal_mm / sqrt(2)
  motor_center_y_mm:
    value: 67.175144
    source: derived
    formula: motor_center_diagonal_mm / sqrt(2)
  motor_axis_z_mm: 7.0

body:
  shape: lofted
  width_mm: 34.0
  length_mm: 50.0
  height_mm: 25.0
  longitudinal_segments: 18
  radial_segments: 32
  width_profile_power: 0.72
  height_profile_power: 1.05
  cross_section_power: 0.78
  center_z_mm: 0.0
  width_source: photo_estimated
  length_source: measured
  height_source: measured

arm:
  enabled: true
  root_width_mm: 10.0
  tip_width_mm: 7.0
  thickness_mm: 5.0
  root_fraction: 0.34
  center_z_mm: 0.0
  source: photo_estimated

motor:
  housing_diameter_mm: 11.0
  housing_height_mm: 14.0
  center_z_mm: 3.0
  shaft_diameter_mm: 2.0
  shaft_height_mm: 4.0
  source: photo_estimated

propeller:
  diameter_mm: 50.0
  hub_diameter_mm: 7.0
  hub_height_mm: 3.0
  blade_count: 2
  blade_root_width_mm: 7.0
  blade_tip_width_mm: 4.0
  blade_thickness_mm: 1.2
  blade_root_radius_mm: 4.0
  center_z_mm: 12.0
  directions:
    fl: ccw
    fr: cw
    rl: cw
    rr: ccw
  direction_source: placeholder

guard:
  enabled: true
  size_mode: fit_overall
  outer_diameter_mm:
    value: 65.824856
    source: derived
    formula: overall_width_mm - motor_center_x_mm
  tube_diameter_mm: 2.4
  center_z_mm: 8.0
  inner_gap_deg: 84.0
  major_segments: 48
  minor_segments: 8
  strut_count: 3
  source: derived_and_photo_estimated

landing:
  enabled: true
  leg_diameter_mm: 3.5
  leg_height_mm: 8.0
  leg_center_z_mm: -7.5
  foot_diameter_mm: 5.0
  foot_height_mm: 4.0
  foot_center_z_mm: -12.5
  source: photo_estimated

physics:
  center_of_mass_mm: [0.0, 0.0, 0.0]
  center_of_mass_source: placeholder
  mass_g: null
  inertia_kg_m2: null
  inertia_source: pending

references:
  top: input/raw_photos/drone2/上.jpg
  bottom: input/raw_photos/drone2/下.jpg
  front: input/raw_photos/drone2/前.jpg
  back: input/raw_photos/drone2/後.jpg
  left: input/raw_photos/drone2/左.jpg
  right: input/raw_photos/drone2/右.jpg
  dimensions: input/raw_photos/drone2/寸法.png
  body_height_dimensions: input/raw_photos/drone2/寸法2.png
  body_length_dimensions: input/raw_photos/drone2/寸法3.png

output:
  directory: output/drone2_parametric
  blend: drone2.blend
  glb: drone2.glb
  resolved_config: resolved_config.json
  build_report: build_report.json
  qa_report: qa_report.json
  render_resolution: 720
