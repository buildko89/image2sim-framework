# ==============================================================================
# Foxtech Loong 2160 VTOL (Standard QuadPlane)
#
# 実機 Foxtech Loong 2160（RCDrone / Foxtech FPV 公式製品）に完全に準拠したモデル。
# - 機首ノーズ先端に牽引式トラクタープロペラ（アルミスピナー＋フォールディングプロペラ）
# - 一体成型された美しい流線型胴体（全長 1200mm）
# - 主翼下に独立した左右 2 本の短いカーボン VTOL ブーム（尾翼へは伸びない）
# - 胴体尾部に完全に 1 組の通常尾翼（単一垂直尾翼＋単一水平尾翼）
# - 余計な浮遊動翼パーツやドローン脚は一切なしのクリーンな実機フォルム
# ==============================================================================
template_file: config/drone_templates/multirotor_base.yaml
schema_version: "1.1"
subject_id: vtol_quadplane_s0
units: mm
dimensions_provisional: false

coordinate_system:
  right_axis: +X
  front_axis: +Y
  up_axis: +Z
  root_origin: estimated_center_of_mass

measurements:
  overall_width_mm:
    value: 2160.0
    source: published_spec
    tolerance_mm: 20.0
    note: 実機翼幅 2160mm
  overall_length_mm:
    value: 1222.7
    source: derived_from_model
    tolerance_mm: 5.0
    note: 機首プロペラスピナー先端から垂直尾翼後端までの全長（実寸1222.7mm、CoDrone部品完全除去後）
  overall_height_mm:
    value: 330.0
    source: estimated
    tolerance_mm: 40.0
    note: 胴体下面から垂直尾翼先端までの全高
  propeller_diameter_mm:
    value: 406.4
    source: assumed
    tolerance_mm: 5.0
    note: リフト用 16 インチカーボンプロペラ
  mass_g:
    value: 7000.0
    source: published_spec
    tolerance_g: 500.0
    note: 最大離陸重量 約 7.0 kg（空虚重量 3.8kg）

layout:
  mode: explicit
  motor_axis_z_mm: 95.0
  motor_positions_mm:
    lift_fl: [-380.0,  370.0, 95.0]
    lift_fr: [ 380.0,  370.0, 95.0]
    lift_rl: [-380.0, -370.0, 95.0]
    lift_rr: [ 380.0, -370.0, 95.0]
    pusher:  [   0.0,  450.0,  0.0]
  rotor_orientation_deg:
    pusher: [-90.0, 0.0, 0.0]
  rotor_roles:
    lift_fl: lift
    lift_fr: lift
    lift_rl: lift
    lift_rr: lift
    pusher: pusher

body:
  shape: lofted
  canopy_cap: false
  codrone_details: false
  width_mm: 160.0
  length_mm: 1200.0
  height_mm: 140.0
  center_y_mm: -150.0
  center_z_mm: 0.0
  nose_bias: 0.35
  longitudinal_segments: 24
  radial_segments: 32
  width_profile_power: 0.65
  height_profile_power: 0.70
  cross_section_power: 1.8
  material: shell_white

arm:
  enabled: false

structure:
  enabled: true
  show_grooves: false
  members:
    # 主翼下の左右 2 本の独立 VTOL ブーム（カーボン丸パイプ：前後長 840mm）
    - id: boom_left
      shape: cylinder
      profile: boom
      material: carbon
      dimensions_mm: [22.0, 840.0, 22.0]
      location_mm: [-380.0, 0.0, 50.0]
    - id: boom_right
      shape: cylinder
      profile: boom
      material: carbon
      dimensions_mm: [22.0, 840.0, 22.0]
      location_mm: [ 380.0, 0.0, 50.0]

motor_mount:
  enabled: true
  material: dark
  dimensions_mm: [32.0, 75.0, 16.0]
  center_z_mm: 70.0
  bevel_mm: 2.0
  enabled_by_rotor:
    pusher: false

motor:
  housing_diameter_mm: 42.0
  housing_height_mm: 30.0
  center_z_mm: 86.0
  center_z_by_rotor_mm:
    pusher: -41.2
  shaft_diameter_mm: 6.0
  shaft_height_mm: 14.0
  material_by_rotor:
    pusher: dark

propeller:
  diameter_mm: 406.4
  hub_diameter_mm: 28.0
  hub_height_mm: 10.0
  blade_count: 2
  blade_root_width_mm: 28.0
  blade_tip_width_mm: 16.0
  blade_thickness_mm: 3.5
  blade_root_radius_mm: 16.0
  center_z_mm: 95.0
  center_z_by_rotor_mm:
    pusher: 0.0
  offset_z_by_rotor_mm:
    pusher: -20.575
  spinner_offset_z_by_rotor_mm:
    pusher: -37.262
  spinner_rotation_deg_by_rotor:
    pusher: [0.0, 0.0, 0.0]
  directions:
    lift_fl: ccw
    lift_fr: cw
    lift_rl: cw
    lift_rr: ccw
    pusher: ccw
  direction_source: design
  diameter_overrides:
    pusher: 406.4
  blade_shape_by_rotor:
    pusher: scimitar
  spinner_by_rotor:
    pusher: bullet
  spinner_length_mm: 40.0
  spinner_material: aluminum

guard:
  enabled: false

landing:
  enabled: false

wing:
  enabled: true
  material: shell_white
  span_mm: 2160.0
  root_chord_mm: 260.0
  tip_chord_mm: 160.0
  thickness_mm: 30.0
  center_x_mm: 0.0
  center_y_mm: 0.0
  center_z_mm: 65.0

tail:
  enabled: true
  material: shell_white
  surfaces:
    # 単一の水平尾翼（胴体尾端上面に直接マウント）
    - id: horizontal
      part_type: tail_surface
      span_mm: 540.0
      root_chord_mm: 160.0
      tip_chord_mm: 110.0
      thickness_mm: 16.0
      center_x_mm: 0.0
      center_y_mm: -670.0
      center_z_mm: 15.0
    # 単一の垂直尾翼（水平尾翼の中央基部から立ち上がる）
    - id: vertical
      part_type: tail_surface
      span_mm: 250.0
      root_chord_mm: 200.0
      tip_chord_mm: 120.0
      thickness_mm: 18.0
      center_x_mm: 0.0
      center_y_mm: -670.0
      center_z_mm: 135.0
      rotation_deg: [0.0, 90.0, 0.0]

equipment:
  boxes:
    - id: flight_computer
      part_type: flight_computer
      dimensions_mm: [70.0, 90.0, 30.0]
      location_mm: [0.0, 0.0, 10.0]
      material: electronics
    - id: battery
      part_type: battery
      dimensions_mm: [90.0, 180.0, 60.0]
      location_mm: [0.0, 120.0, 0.0]
      material: battery
  cylinders:
    # 胴体上面の垂直アンテナ（実機 DSC_6245）
    - id: radio_antenna
      radius_mm: 2.5
      height_mm: 90.0
      location_mm: [0.0, -120.0, 110.0]
      material: dark
    # 左主翼のピトー管（実機 loong_3.jpg）
    - id: pitot_tube
      radius_mm: 2.5
      height_mm: 60.0
      location_mm: [-600.0, 150.0, 65.0]
      rotation_deg: [90.0, 0.0, 0.0]
      material: aluminum

physics:
  center_of_mass_mm: [0.0, 0.0, 10.0]
  center_of_mass_source: estimated
  mass_g: 7000.0
  inertia_kg_m2: null
  inertia_source: pending

references:
  hero: input/loong_dsc6245.jpg

output:
  directory: output/vtol_quadplane
  blend: vtol_quadplane.blend
  glb: vtol_quadplane.glb
  resolved_config: resolved_config.json
  build_report: build_report.json
  qa_report: qa_report.json
  render_resolution: 720
