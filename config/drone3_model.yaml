qa_notes:
  - 2445/2560/500/880/1500 mmは写真注記、PDF図面、MiSUMi型番で相互確認済みです。
  - 2560 mm横フレームは2445 mm縦フレーム端のモーター中心から500 mm内側へ配置しています。
  - 主翼側2560 mm横フレーム端の2モーターはフレーム下面取付です。
  - GPSは500 mm支柱の上に円形アンテナを載せています。
  - ローター8基、G34径863.6 mm、主翼2500×400 mmはPDF図面と部品表から採用しました。
  - モータ外形はメーカー公称、ESC・その他電装箱・取付ブラケット細部は暫定の代表形状です。
  - ブラケット・締結部品の数量、完成質量、重心、慣性、実機ローター回転方向は未確定です。

